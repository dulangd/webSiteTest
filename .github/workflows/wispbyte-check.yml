name: Wispbyte mirror check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check wispbyte/index.js
      - name: Verify live Wispbyte node and Registry
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            if curl -fsS --connect-timeout 10 --max-time 20 https://1st.wispbyte.app/health -o /tmp/health.json; then
              cat /tmp/health.json
              node - <<'NODE'
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          if (h.ok !== true) process.exit(2);
          if (h.service !== 'wispbyte-node') process.exit(3);
          if (h.version !== '2.0.2') process.exit(4);
          if (h.node_id !== 'wispbyte-rbigccnsjeqso9ch') process.exit(5);
          if (h.endpoint !== 'https://1st.wispbyte.app:443') process.exit(6);
          if (h.registry?.auth_mode !== 'public-proof' && h.registry?.auth_mode !== 'bearer-token') process.exit(7);
          if (h.registry?.registered !== true) process.exit(8);
          if (!(Number(h.registry?.last_status) >= 200 && Number(h.registry?.last_status) < 300)) process.exit(9);
          console.log('LIVE_WISPBYTE_OK version=' + h.version + ' registry=' + h.registry.auth_mode + ' status=' + h.registry.last_status);
          NODE
              exit 0
            fi
            sleep 10
          done
          echo 'Live Wispbyte verification did not become healthy/registered in time' >&2
          exit 1
