name: Wispbyte live probe
on:
  push:
    branches: [wispbyte-live-probe]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe Wispbyte after restart
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 10 --max-time 20 https://1st.wispbyte.app/health -o /tmp/wisp.json
          cat /tmp/wisp.json; echo
          node - <<'NODE'
          const fs=require('fs');
          const w=JSON.parse(fs.readFileSync('/tmp/wisp.json','utf8'));
          if(w.ok!==true) throw new Error('Wispbyte unhealthy');
          if(w.version!=='2.0.4') throw new Error('unexpected Wispbyte version='+w.version);
          if(w.registry?.registered!==true) throw new Error('registry not registered');
          if(Number(w.registry?.last_status)!==200) throw new Error('registry status='+w.registry?.last_status);
          console.log('WISPBYTE_POST_RESTART_OK version='+w.version+' registry='+w.registry.auth_mode+' status='+w.registry.last_status+' last_success='+w.registry.last_success_at);
          NODE
