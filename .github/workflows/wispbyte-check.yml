name: Wispbyte live probe
on:
  push:
    branches: [wispbyte-live-probe]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check repository runtime syntax
        run: |
          node --check wispbyte/index.js
          node --check wispbyte/bootstrap.js
      - name: Probe Railway production
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 10 --max-time 20 https://subscription-server-v2-production.up.railway.app/health -o /tmp/rh.json
          cat /tmp/rh.json; echo
          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/rh.json','utf8'));
          if(h.ok!==true) throw new Error('Railway health failed');
          console.log('RAILWAY_HEALTH_OK version='+(h.version||h.service||'unknown'));
          NODE
          code=$(curl -sS -o /tmp/traffic.html -w '%{http_code}' --connect-timeout 10 --max-time 20 https://subscription-server-v2-production.up.railway.app/traffic)
          echo "RAILWAY_TRAFFIC_HTTP=$code bytes=$(wc -c </tmp/traffic.html)"
          test "$code" = "200" -o "$code" = "302" -o "$code" = "401"
      - name: Probe permanent subscription gateway
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/seeder.out -w '%{http_code}' --connect-timeout 10 --max-time 20 https://subscription-seeder2-production.up.railway.app/)
          echo "SEEDER_HTTP=$code bytes=$(wc -c </tmp/seeder.out)"
          head -c 200 /tmp/seeder.out || true
          echo
          test "$code" = "200"
          test -s /tmp/seeder.out
      - name: Probe Wispbyte and JustRunMy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 10 --max-time 20 https://1st.wispbyte.app/health -o /tmp/wisp.json
          curl -fsS --connect-timeout 10 --max-time 20 https://lst.b.onjrnm.vip/health -o /tmp/jrmy.json
          cat /tmp/wisp.json; echo
          cat /tmp/jrmy.json; echo
          node - <<'NODE'
          const fs=require('fs');
          const w=JSON.parse(fs.readFileSync('/tmp/wisp.json','utf8'));
          const j=JSON.parse(fs.readFileSync('/tmp/jrmy.json','utf8'));
          if(w.ok!==true||w.registry?.registered!==true) throw new Error('Wispbyte unhealthy');
          if(j.ok!==true) throw new Error('JustRunMy unhealthy');
          console.log('WISPBYTE_LIVE version='+w.version+' registry='+w.registry?.auth_mode+' status='+w.registry?.last_status);
          console.log('JUSTRUNMY_LIVE version='+j.version+' registry='+j.registry?.auth_mode+' status='+j.registry?.last_status);
          NODE
